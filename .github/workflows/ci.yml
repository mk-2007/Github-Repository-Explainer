name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    name: Typecheck & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Next.js production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://repoexplainer:repoexplainer@localhost:5432/repo_explainer
          GROQ_API_KEY: ci-mock-key
          GEMINI_API_KEY: ci-mock-key
          GITHUB_TOKEN: ci-mock-token
